<svg xmlns="http://www.w3.org/2000/svg" width="236" height="44" viewBox="0 0 236 44" role="img" aria-label="IronLedger">
  <!-- I-beam mark: an original structural-steel profile, read as a ledger column -->
  <g fill="#d6a84e">
    <rect x="2" y="5" width="30" height="6" rx="1.5"/>
    <rect x="13" y="11" width="8" height="22" rx="1"/>
    <rect x="2" y="33" width="30" height="6" rx="1.5"/>
  </g>
  <g fill="#0b0c0e" opacity="0.55">
    <rect x="15.5" y="15" width="3" height="1.6"/>
    <rect x="15.5" y="20" width="3" height="1.6"/>
    <rect x="15.5" y="25" width="3" height="1.6"/>
  </g>
  <text x="42" y="25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="800"
        letter-spacing="2.4" fill="#ebe8e2">IRON<tspan fill="#d6a84e">LEDGER</tspan></text>
  <text x="43" y="38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="7.2" font-weight="600"
        letter-spacing="1.55" fill="#8a8f98">COMMERCIAL TRUCK INTELLIGENCE</text>
</svg>
